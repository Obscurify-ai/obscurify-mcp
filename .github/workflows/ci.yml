name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run build
      - run: npm audit --omit=dev
      - name: Lists its tools and models without an API key
        run: |
          npx -y @modelcontextprotocol/inspector@latest --cli node dist/index.js --method tools/list > tools.json
          node -e 'const t=require("./tools.json").tools.map(t=>t.name).sort().join(); if(t!=="ask,balance,chat,generate_image,list_models,second_opinion") throw new Error(t)'
          npx -y @modelcontextprotocol/inspector@latest --cli node dist/index.js --method tools/call --tool-name list_models --tool-arg limit=3
